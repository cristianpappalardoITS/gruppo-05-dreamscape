services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    ports:
      - '5432'
  # Solo per lo sviluppo: raccoglie le email del backend (recupero password).
  # Le email si leggono su http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.31'
    ports:
      - '1025:1025'
      - '8025:8025'
  # Motore di gioco (decisione 029): il backend lo chiama con la chiave ENGINE_API_KEY.
  # L'immagine si ricostruisce a ogni avvio da sviluppo/engine, così segue sempre il codice del motore
  # (se il codice non è cambiato ci mette pochi secondi). Porta aperta solo su questo computer
  engine:
    build: '../engine'
    image: 'dreamscape-engine:dev'
    pull_policy: 'build'
    environment:
      - 'ENGINE_API_KEY=${ENGINE_API_KEY:-chiave-di-sviluppo-del-motore}'
    ports:
      - '127.0.0.1:8081:8081'
