services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    ports:
      - '5432'
  # Solo per lo sviluppo: raccoglie le email del backend (recupero password).
  # Le email si leggono su http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.31'
    ports:
      - '1025:1025'
      - '8025:8025'
