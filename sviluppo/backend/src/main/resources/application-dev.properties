# Profilo dev: oltre alle tabelle carica i dati finti (da V900, codici TEST-).
# db/devdata vale solo qui, non nei test: spegne le carte di prova, così si vedono quelle vere (V102)
spring.flyway.locations=classpath:db/migration,classpath:db/testdata,classpath:db/devdata

# Chiave JWT finta, valida solo in locale (alla consegna arriva da JWT_SECRET)
dreamscape.security.jwt-secret=${JWT_SECRET:chiave-di-sviluppo-dreamscape-non-usare-in-produzione}

# Le email del recupero password finiscono in Mailpit (compose.yaml): http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025

# Stessa chiave di prova del motore avviato da Docker Compose (compose.yaml)
dreamscape.engine.api-key=${ENGINE_API_KEY:chiave-di-sviluppo-del-motore}
