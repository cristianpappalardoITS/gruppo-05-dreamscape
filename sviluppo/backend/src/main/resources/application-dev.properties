# Profilo dev: oltre alle tabelle carica i dati finti (da V900, codici TEST-)
spring.flyway.locations=classpath:db/migration,classpath:db/testdata

# Chiave JWT finta, valida solo in locale (alla consegna arriva da JWT_SECRET)
dreamscape.security.jwt-secret=${JWT_SECRET:chiave-di-sviluppo-dreamscape-non-usare-in-produzione}

# Le email del recupero password finiscono in Mailpit (compose.yaml): http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
