spring.application.name=dreamscape-api

# Database: alla consegna dalle variabili d'ambiente; in locale lo avvia Docker Compose (compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dreamscape}
spring.datasource.username=${DB_USERNAME:dreamscape}
spring.datasource.password=${DB_PASSWORD:}

# Le tabelle le crea solo Flyway: Hibernate le controlla e basta
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
