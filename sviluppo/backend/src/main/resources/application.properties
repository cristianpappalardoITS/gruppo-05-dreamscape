spring.application.name=dreamscape-api

# Database: alla consegna dalle variabili d'ambiente; in locale lo avvia Docker Compose (compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dreamscape}
spring.datasource.username=${DB_USERNAME:dreamscape}
spring.datasource.password=${DB_PASSWORD:}

# Le tabelle le crea solo Flyway: Hibernate le controlla e basta
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Accesso con JWT: la chiave (almeno 32 caratteri) arriva sempre da una variabile d'ambiente
dreamscape.security.jwt-secret=${JWT_SECRET}
dreamscape.security.access-token-ttl=15m
dreamscape.security.refresh-token-ttl=7d
dreamscape.security.password-reset-token-ttl=1h
# Cookie del refresh token solo su HTTPS (i browser accettano lo stesso anche http://localhost)
dreamscape.security.refresh-cookie-secure=true

# Primo admin, creato all'avvio se manca. Vuoti = nessun admin creato
dreamscape.admin.username=${ADMIN_USERNAME:}
dreamscape.admin.email=${ADMIN_EMAIL:}
dreamscape.admin.password=${ADMIN_PASSWORD:}

# Email (recupero password): il server SMTP arriva da SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD. Senza SPRING_MAIL_HOST il link si scrive solo nel log
dreamscape.mail.from=${MAIL_FROM:noreply@dreamscape.local}
# Pagina "Nuova password" del frontend: il token si aggiunge in fondo
dreamscape.mail.password-reset-url=${PASSWORD_RESET_URL:http://localhost:8080/nuova-password.html?token=}

# Numeri dell'economia (decisioni 013 e 014): non stanno nel codice
dreamscape.game.signup-bonus=500
dreamscape.game.daily-reward=50
dreamscape.game.deck-size=20
dreamscape.game.time-zone=Europe/Rome
