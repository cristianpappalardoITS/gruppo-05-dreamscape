// Nucleo del motore: solo Java, nessuna libreria a parte JUnit per i test.
// Spring, database e HTTP non devono mai entrare qui (regole-codice.md).
plugins {
    id 'java-library'
}

group = 'it.somnia'
version = '0.1.0'
description = 'Nucleo del motore di gioco di Dreamscape'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
