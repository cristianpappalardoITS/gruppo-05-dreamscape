// Servizio HTTP del motore (decisione 029): espone engine-core al solo backend con POST /api/v1/simulations.
// Nessuna logica di gioco qui: riceve il JSON, chiama il nucleo, restituisce il risultato
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'it.somnia'
version = '0.2.0'
description = 'Servizio HTTP del motore di gioco di Dreamscape'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':engine-core')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
