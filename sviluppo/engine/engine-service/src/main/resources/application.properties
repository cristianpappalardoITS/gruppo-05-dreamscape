spring.application.name=dreamscape-engine

# 8081 perché in sviluppo sulla 8080 c'è già il backend
server.port=${PORT:8081}

# Chiave condivisa con il backend (intestazione X-Engine-Key, decisione 029): arriva sempre da una
# variabile d'ambiente e non va mai nel repository. Senza, il servizio non parte
dreamscape.engine.api-key=${ENGINE_API_KEY:}
