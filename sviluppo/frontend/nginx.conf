# nginx del frontend nei container (#100): serve il sito e passa le chiamate al backend.
# "backend" è il nome del servizio in sviluppo/compose.yaml
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Illustrazioni del backoffice fino a 15 MB (come spring.servlet.multipart nel backend)
    client_max_body_size 16m;

    # Chiamate al backend e immagini delle carte e dei pacchetti
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Swagger del backend, comodo per provare le API dallo stesso indirizzo
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File di Vite con il nome che cambia a ogni versione: si tengono in cache per sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le pagine (/collezione, /partite/..., /nuova-password...) sono tutte index.html:
    # il router di main.jsx sceglie la pagina dall'indirizzo
    location / {
        try_files $uri $uri/ /index.html;
    }
}
